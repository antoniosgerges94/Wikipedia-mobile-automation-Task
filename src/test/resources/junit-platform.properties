cucumber.glue=com.automation.wikipedia.steps
cucumber.plugin=pretty,html:target/cucumber-reports/cucumber.html,json:target/cucumber-reports/cucumber.json,rerun:target/failed-scenarios.txt,io.qameta.allure.cucumber7jvm.AllureCucumber7Jvm
cucumber.snippet-type=camelcase
cucumber.publish.quiet=true
cucumber.junit-platform.naming-strategy=long
cucumber.execution.parallel.enabled=false
cucumber.execution.parallel.config.strategy=fixed
cucumber.execution.parallel.config.fixed.parallelism=1
